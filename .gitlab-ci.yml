image: python:3.9

stages:
  - build
  - test
  - deploy

before_script:
  - pip install --upgrade pip
  - pip install pytest
  - pip install -r requirements.txt

build:
  stage: build
  script:
    - echo "Building project"

test:
  stage: test
  script:
    - python -m pytest

deploy:
  stage: deploy
  script:
    - echo "Deploying project"